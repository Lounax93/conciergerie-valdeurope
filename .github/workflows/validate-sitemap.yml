name: Validate sitemap

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sitemap.xml is well-formed XML
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout sitemap.xml
